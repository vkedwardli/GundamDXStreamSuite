<!doctype html>
<html lang="zh-Hant">
  <head>
    <title>Scoreboard Overlay</title>
    <meta charset="UTF-8" />
    <style>
      body {
        position: relative;
        margin: 0;
        padding: 0;
        background-color: transparent; /* Keep body fully transparent */
        width: 1920px;
        height: 760px;
        overflow: hidden;
        font-family: "a Atmospheric", sans-serif;
        color: white;
        -webkit-app-region: no-drag; /* No longer need dragging if it's full width */
      }
      .scoreboard-container {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 120px;
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 60px; /* Space for the divider */
        background: rgba(0, 0, 0, 0.5);
        padding: 18px 0;
        box-sizing: border-box;
      }
      .faction-box {
        display: flex;
        align-items: baseline;
        position: relative; /* Anchor for absolute streaks */
      }
      .wins {
        font-size: 84px;
        font-weight: bold;
        text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.8);
        line-height: 1;
        min-width: 120px;
        text-align: center;
      }
      .streak {
        position: absolute;
        display: flex;
        gap: 4px;
        align-items: baseline;
        top: 50%;
        transform: translateY(-50%);
        white-space: nowrap;
      }
      #fed-streak {
        right: 100%; /* Grow to the left */
        margin-right: 40px;
        flex-direction: row-reverse; /* Keep newest star closest to score */
      }
      #zeon-streak {
        left: 100%; /* Grow to the right */
        margin-left: 40px;
      }
      .streak img {
        height: 108px;
        width: auto;
        margin: 0 -25px; /* Negative horizontal margin to overlap/tighten stars */
      }
      .divider {
        font-size: 48px;
        font-weight: bold;
        opacity: 0.8;
        line-height: 1;
      }

      #zeon-wins {
        color: #ff9999;
      }

      /* Caption background covers the scoreboard too; only opacity animates. */
      #comment-overlay {
        position: absolute;
        inset: 0;
        height: 760px;
        background: #080d13 url("./images/overlaybackground-static.png") center / 100% 100% no-repeat;
        opacity: 0;
        transition: opacity 0.7s ease;
        pointer-events: none;
        font-family: "Microsoft JhengHei UI", "Microsoft JhengHei", "PingFang TC", "Heiti TC", sans-serif;
        --accent: #8fc8ff;
      }
      #comment-overlay.visible { opacity: 1; }
      .caption-border-pulse {
        position: absolute;
        inset: 14px;
        border-radius: 4px;
        background:
          linear-gradient(to right, var(--accent), transparent) left / 200px 100% no-repeat,
          linear-gradient(to left, var(--accent), transparent) right / 200px 100% no-repeat,
          linear-gradient(to bottom, var(--accent), transparent) top / 100% 200px no-repeat,
          linear-gradient(to top, var(--accent), transparent) bottom / 100% 200px no-repeat;
        opacity: 0;
        pointer-events: none;
      }
      #comment-overlay::after {
        content: "";
        position: absolute;
        top: 640px;
        left: 16px;
        right: 16px;
        height: 1px;
        background: rgba(115, 194, 225, 0.35);
      }
      .scoreboard-container { z-index: 1; }
      .caption {
        position: relative;
        z-index: 1;
        box-sizing: border-box;
        height: 640px;
        border-top: 10px solid transparent;
        padding: 28px 80px 20px;
        display: flex;
        flex-direction: column;
      }
      .caption-header {
        height: 82px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 36px;
      }
      #comment-author {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 58px;
        font-weight: 700;
        color: var(--accent);
      }
      #comment-state {
        flex-shrink: 0;
        font-size: 36px;
        border: 2px solid #455263;
        border-radius: 12px;
        padding: 10px 24px;
        color: #c8d1dc;
      }
      #comment-state[data-phase="preparing"] { color: #f8d48d; border-color: #8f713e; }
      #comment-state[data-phase="speaking"] { color: #bcf5d5; border-color: #50765f; }
      #comment-text {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-bottom: 16px;
        font-size: 176px;
        font-weight: 800;
        line-height: 1.23;
        color: #fff;
      }
      .caption-line { white-space: pre; }
      .caption-footer {
        height: 46px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 30px;
        color: #91a2b4;
      }
      #page-dots { display: flex; gap: 14px; }
      .page-dot { width: 42px; height: 8px; background: #374351; }
      .page-dot.current { background: var(--accent); }

      @keyframes new-star-animation {
        0% {
          opacity: 0;
          transform: scale(0.3) rotate(-180deg);
        }
        60% {
          opacity: 1;
          transform: scale(1.2) rotate(10deg);
        }
        100% {
          transform: scale(1) rotate(0deg);
        }
      }
      .new-star {
        animation: new-star-animation 0.5s ease-out forwards;
      }
      #fusion-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #000;
        opacity: 0;
      }
      #fusion-overlay video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div id="fusion-overlay" hidden></div>
    <div id="comment-overlay" aria-hidden="true">
      <section class="caption">
        <div class="caption-header">
          <div id="comment-author"></div>
          <div id="comment-state"></div>
        </div>
        <div id="comment-text" aria-live="polite" aria-atomic="true"></div>
        <div class="caption-footer">
          <span id="page-label"></span>
          <span id="page-dots" aria-hidden="true"></span>
        </div>
      </section>
    </div>
    <div class="scoreboard-container">
      <div class="faction-box">
        <div id="fed-streak" class="streak"></div>
        <div id="fed-wins" class="wins">0</div>
      </div>
      <div class="divider">VS</div>
      <div class="faction-box">
        <div id="zeon-wins" class="wins">0</div>
        <div id="zeon-streak" class="streak"></div>
      </div>
    </div>

    <script src="./socket.io.min.js"></script>
    <script src="./captionEffects.js"></script>
    <script type="module">
      import { paginateCaption } from "./captionLayout.js";
      import { captionPageTimes, CAPTION_HOLD_MS, CAPTION_GAP_MS } from "./ttsTiming.js";

      const monitorOverlay = new URLSearchParams(location.search).get("monitor") === "1";
      const socket = io({ auth: { monitorOverlay } });

      // Only the arcade's Electron window registers this receiver. OBS browser
      // sources and ordinary popout tabs must not also play the video/audio.
      if (monitorOverlay) socket.on("playFusion", (acknowledge) => {
        const layer = document.getElementById("fusion-overlay");
        if (!layer.hidden) return acknowledge({ played: false, error: "Video already playing." });
        const video = document.createElement("video");
        const fadeMs = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 500;
        let fade;
        let finished = false;
        const timeout = setTimeout(() => finish("Video playback timed out."), 30000);
        async function finish(error) {
          if (finished) return;
          finished = true;
          clearTimeout(timeout);
          video.pause();
          // Keep the final frame until it fades away, and hold the shared queue
          // until then. A load failure before the first frame clears immediately.
          const opacity = getComputedStyle(layer).opacity;
          fade?.cancel();
          if (Number(opacity) > 0) {
            fade = layer.animate([{ opacity }, { opacity: 0 }],
              { duration: fadeMs, easing: "ease-in-out", fill: "forwards" });
            await fade.finished.catch(() => {});
          }
          video.removeAttribute("src");
          video.load();
          layer.replaceChildren();
          layer.hidden = true;
          fade?.cancel();
          acknowledge({ played: !error, error });
        }
        video.addEventListener("ended", () => finish());
        video.addEventListener("error", () => finish(video.error?.message || "Cannot load fusion.mp4."));
        video.addEventListener("playing", () => {
          if (finished) return;
          fade = layer.animate([{ opacity: 0 }, { opacity: 1 }],
            { duration: fadeMs, easing: "ease-in-out", fill: "forwards" });
          socket.emit("fusionPlaybackStatus", { status: "playing" });
        }, { once: true });
        video.playsInline = true;
        video.muted = false;
        video.volume = 1;
        video.src = "./fusion.mp4";
        layer.replaceChildren(video);
        layer.hidden = false;
        video.play().catch((error) => finish(error.message));
      });

      const fedWinsEl = document.getElementById("fed-wins");
      const zeonWinsEl = document.getElementById("zeon-wins");
      const fedStreakEl = document.getElementById("fed-streak");
      const zeonStreakEl = document.getElementById("zeon-streak");
      const commentOverlay = document.getElementById("comment-overlay");
      const commentText = document.getElementById("comment-text");
      const captionEffects = createCaptionEffects(commentText, commentOverlay);

      socket.on("connect", () => {
        socket.emit("getInitialGameState");
      });

      let previousState = {
        streaks: { federation: 0, zeon: 0 },
        totalWins: { federation: 0, zeon: 0 },
      };

      socket.on("battleResult", (data) => {
        if (data && data.state) {
          updateScoreboard(data.state);
          previousState = data.state;
        }
      });

      const commentQueue = [];
      const authorEl = document.getElementById("comment-author");
      const stateEl = document.getElementById("comment-state");
      const pageLabel = document.getElementById("page-label");
      const pageDots = document.getElementById("page-dots");
      const measureContext = document.createElement("canvas").getContext("2d");
      let currentComment = null;
      let displayTimer;
      let watchdog;

      socket.on("message", (msg) => {
        if (!msg || typeof msg.plainMessage !== "string" || !msg.plainMessage.trim()) return;
        // Extra guard: Ignore messages that are older than 30 seconds (lag or backlog).
        if (msg.timestamp && Date.now() - new Date(msg.timestamp).getTime() > 30000) return;

        // Users can send a single line. Fit it to this screen, without requiring
        // newlines in YouTube/WhatsApp or breaking a Unicode emoji in half.
        const prefix = msg.plainMessage.match(/^(?:(?:🇨🇳|🌐))?[🔊🔇💁🎤]\s*/u)?.[0] || "";
        const style = getComputedStyle(commentText);
        // Paginate at the baseline size, independently of the previous page's fitted font.
        measureContext.font = `${style.fontWeight} 176px ${style.fontFamily}`;
        const pages = paginateCaption(msg.plainMessage.slice(prefix.length),
          (text) => measureContext.measureText(text).width, 1760);
        commentQueue.push({ msg, prefix, pages });
        processCommentQueue();
      });

      function findComment(messageId) {
        if (!messageId) return null;
        const entry = currentComment?.msg.id === messageId ? currentComment
          : commentQueue.find((item) => item.msg.id === messageId);
        return entry?.msg.tts ? entry : null;
      }

      socket.on("tts_preparing", (event) => {
        const entry = findComment(event?.messageId);
        if (entry === currentComment && entry && !entry.start && !entry.end) waitForSpeech();
      });

      socket.on("tts_started", (event) => {
        const entry = findComment(event?.messageId);
        if (!entry || entry.end || entry.start) return;
        entry.start = event;
        // Speech has priority over an ordinary comment; keep that comment queued.
        if (currentComment !== entry) {
          const index = commentQueue.indexOf(entry);
          commentQueue.splice(index, 1);
          if (currentComment && !currentComment.readComplete && currentComment.end?.status !== "finished") {
            commentQueue.unshift(currentComment);
          }
        }
        showComment(entry);
      });

      socket.on("tts_finished", (event) => {
        const entry = findComment(event?.messageId);
        if (!entry || entry.end) return; // Ignore anonymous/unrelated completion events.
        entry.end = event;
        if (entry === currentComment) finishSpeech();
      });

      function clearDisplayTimers() {
        clearTimeout(displayTimer);
        clearTimeout(watchdog);
      }

      function setPhase(phase, label) {
        stateEl.dataset.phase = phase;
        stateEl.textContent = label;
        if (phase === "preparing") captionEffects.pulse(true);
        else if (currentComment.msg.tts) captionEffects.stopPulse();
      }

      function renderPage(index) {
        captionEffects.finishTyping();
        const entry = currentComment;
        commentText.replaceChildren(...entry.pages[index].map((line) => {
          const element = document.createElement("div");
          element.className = "caption-line";
          element.textContent = line;
          return element;
        }));
        captionEffects.fitText();
        pageLabel.textContent = `${index + 1} / ${entry.pages.length}`;
        // Keep the footer bounded even for unusually long system messages.
        pageDots.replaceChildren(...(entry.pages.length <= 12 ? entry.pages : []).map((_, page) => {
          const dot = document.createElement("span");
          dot.className = `page-dot${page === index ? " current" : ""}`;
          return dot;
        }));
      }

      function processCommentQueue() {
        if (!currentComment && commentQueue.length) showComment(commentQueue.shift());
      }

      function showComment(entry) {
        clearDisplayTimers();
        currentComment = entry;
        commentOverlay.style.setProperty("--accent", entry.msg.isFederation === false ? "#ffb6b6" : "#8fc8ff");
        authorEl.textContent = `${entry.msg.isFederation === false ? "🔴" : "🔵"} ${entry.msg.authorName || "觀眾"} ${entry.prefix}`.trim();
        commentOverlay.classList.add("visible");
        commentOverlay.setAttribute("aria-hidden", "false");
        renderPage(0);
        if (!entry.msg.tts && !entry.arrivalShown) {
          entry.arrivalShown = true;
          captionEffects.pulse();
        }
        if (entry.end) finishSpeech();
        else if (entry.start) followSpeech();
        else if (entry.msg.tts) waitForSpeech();
        else readPages();
      }

      function waitForSpeech() {
        clearDisplayTimers();
        setPhase("preparing", "準備語音…");
        if (!currentComment.preparationShown) {
          currentComment.preparationShown = true;
          captionEffects.typeFirstPage();
        }
        // Prevent a lost connection or failed child process from covering OBS forever.
        watchdog = setTimeout(() => readPages("語音暫時未能播放"), 180000);
      }

      function followSpeech() {
        setPhase("speaking", "播放中");
        const { pages, start } = currentComment;
        const times = captionPageTimes(pages, start.cues || [], start.durationMs);
        const updatePage = () => {
          const elapsed = Math.max(0, Date.now() - start.startedAt);
          let page = 0;
          while (page + 1 < times.length && times[page + 1] <= elapsed) page++;
          renderPage(page);
          if (page + 1 < times.length) displayTimer = setTimeout(updatePage, times[page + 1] - elapsed);
        };
        updatePage();
        watchdog = setTimeout(() => readPages("語音狀態不明"),
          Math.max(1000, start.startedAt + start.durationMs + 15000 - Date.now()));
      }

      function finishSpeech() {
        clearDisplayTimers();
        if (currentComment.end.status !== "finished") {
          readPages("語音未能播放");
          return;
        }
        renderPage(currentComment.pages.length - 1);
        setPhase("hold", "播放完畢");
        displayTimer = setTimeout(hideComment, CAPTION_HOLD_MS);
      }

      function readPages(label = "留言") {
        clearDisplayTimers();
        setPhase("reading", label);
        let page = 0;
        const advance = () => {
          renderPage(page++);
          displayTimer = setTimeout(page < currentComment.pages.length ? advance : hideComment, 5000);
        };
        advance();
      }

      function hideComment() {
        clearDisplayTimers();
        captionEffects.cancel();
        currentComment.readComplete = true;
        commentOverlay.classList.remove("visible");
        commentOverlay.setAttribute("aria-hidden", "true");
        // Keep content in place during the fade; the scoreboard stays visible.
        displayTimer = setTimeout(() => {
          currentComment = null;
          processCommentQueue();
        }, CAPTION_GAP_MS);
      }

      function updateScoreboard(state) {
        fedWinsEl.textContent = state.totalWins.federation || 0;
        zeonWinsEl.textContent = state.totalWins.zeon || 0;

        updateStreak(
          fedStreakEl,
          previousState.streaks.federation,
          state.streaks.federation,
          true,
        );
        updateStreak(
          zeonStreakEl,
          previousState.streaks.zeon,
          state.streaks.zeon,
          false,
        );
      }

      function updateStreak(container, prevCount, newCount, isFederation) {
        if (newCount === prevCount + 1 && container.childElementCount === prevCount) {
          const newStar = document.createElement("img");
          newStar.src = "./images/star.png";
          newStar.classList.add("new-star");
          if (isFederation) {
            container.insertBefore(newStar, container.firstChild);
          } else {
            container.appendChild(newStar);
          }
        } else if (container.childElementCount !== newCount) {
          // Restore the full count on first load, reconnect, or a streak reset.
          container.innerHTML = "";
          for (let i = 0; i < newCount; i++) {
            const star = document.createElement("img");
            star.src = "./images/star.png";
            container.appendChild(star);
          }
        }
      }

    </script>
  </body>
</html>
